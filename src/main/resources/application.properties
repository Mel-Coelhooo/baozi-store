spring.application.name=baozi-store
server.port=8080

# ===== Banco de dados H2 (arquivo local: os dados persistem entre execucoes) =====
spring.datasource.url=jdbc:h2:file:./data/baozistore
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Alternativa: MySQL (comente o bloco H2 acima e descomente abaixo) =====
#spring.datasource.url=jdbc:mysql://localhost:3306/baozistore?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
#spring.datasource.username=root
#spring.datasource.password=sua_senha
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
